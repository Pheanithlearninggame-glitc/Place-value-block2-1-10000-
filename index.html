<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>កម្មវិធីបង្រៀនតម្លៃលេខតាមខ្ទង់ - Base-10 Blocks & Arrow Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;900&family=Lora:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Kantumruy Pro', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    .math-grid {
      background-color: #ffffff;
      background-image:
        linear-gradient(to right, rgba(203, 213, 225, 0.6) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.6) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
    }
    .math-grid.no-grid {
      background-image: none !important;
    }
    .draggable-item {
      position: absolute;
      touch-action: none;
      user-select: none;
      cursor: grab;
      will-change: left, top, transform;
      transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1), top 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .draggable-item:active {
      cursor: grabbing;
    }
    .draggable-item.dragging {
      cursor: grabbing !important;
      transition: none !important;
      z-index: 100 !important;
      transform: scale(1.05);
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.25));
    }
    .block-selected {
      filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.95)) drop-shadow(0 0 2px #2563eb);
      outline: 3px dashed #2563eb;
      outline-offset: 4px;
      border-radius: 8px;
    }
    .drawing-selected {
      filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.95));
      outline: 2px dashed #2563eb;
      outline-offset: 4px;
      border-radius: 6px;
    }
    .selection-marquee {
      position: absolute;
      border: 2px dashed #2563eb;
      background: rgba(59, 130, 246, 0.2);
      pointer-events: none;
      z-index: 60;
      border-radius: 4px;
    }
    .cartoon-char {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cartoon-char:active {
      transform: scale(1.15) rotate(5deg);
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
    }
    @keyframes smoothFadeIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-spawn {
      animation: smoothFadeIn 0.2s ease-out forwards;
    }
    .pen-opt-btn.active {
      background-color: rgba(59, 130, 246, 0.25);
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px #38bdf8;
    }
    #bottomFooter {
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #bottomFooter.collapsed {
      transform: translateY(100%);
    }

    body.pen-mode #layerBlocks,
    body.pen-mode #layerCards,
    body.pen-mode #layerDrawings,
    body.pen-mode #layerAbacus {
      pointer-events: none !important;
    }
    body.pen-mode #gridBoard {
      cursor: crosshair;
    }

    input[type=range].pen-size-slider {
      -webkit-appearance: none;
      appearance: none;
      background: #475569;
      height: 5px;
      border-radius: 4px;
      outline: none;
    }
    input[type=range].pen-size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col bg-slate-100 overflow-hidden">

  <!-- TOP HEADER -->
  <header class="w-full h-12 bg-white border-b-2 border-slate-300 px-2 sm:px-4 flex items-center justify-between shrink-0 z-30 shadow-sm overflow-x-auto" style="scrollbar-width: none;">
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="flex items-center gap-1 bg-slate-100 border border-slate-300 px-2 py-0.5 rounded-lg shadow-inner">
        <span class="text-lg">🐘</span>
        <span class="text-[11px] font-black tracking-tight text-slate-700 uppercase">គណិតវិទ្យា</span>
      </div>
      <h1 class="text-xs sm:text-base font-extrabold text-slate-800 ml-1 truncate">តម្លៃលេខតាមខ្ទង់</h1>
    </div>

    <!-- Right Header Controls -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btnHeaderFullscreen" class="px-2 py-1 bg-white border-2 border-slate-300 rounded-lg text-xs font-bold text-slate-700 shadow-sm hover:bg-slate-50 active:scale-95 transition flex items-center justify-center gap-1" title="ពេញអេក្រង់ (Fullscreen)">
        <svg class="w-4 h-4 text-slate-700 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4H5a2 2 0 0 0-2 2v2"/>
          <path d="M17 4h2a2 2 0 0 1 2 2v2"/>
          <path d="M7 20H5a2 2 0 0 1-2-2v-2"/>
          <path d="M17 20h2a2 2 0 0 0 2-2v-2"/>
        </svg>
      </button>

      <button id="btnAutoRegroupAll" class="px-2.5 py-1 bg-gradient-to-r from-emerald-600 to-teal-600 active:scale-95 text-white rounded-lg text-xs font-black shadow-md transition flex items-center gap-1 border border-emerald-400" title="ផ្ដុំស្វ័យប្រវត្តិតាមលំដាប់ខ្ទង់">
        <span>⚡</span>
        <span class="hidden md:inline">ផ្ដុំស្វ័យប្រវត្តិ</span>
      </button>

      <button id="btnPushArrange" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-lg text-xs font-black shadow-md transition flex items-center gap-1" title="រុញតម្រៀបបន្ទះទាំងអស់តាមជួរខ្ទង់">
        <span>🔲</span>
        <span class="hidden md:inline">រុញរៀបជួរ</span>
      </button>

      <button id="btnDecomposeSelected" class="px-2.5 py-1 bg-amber-500 active:scale-95 text-white rounded-lg text-xs font-black shadow-md transition hidden items-center gap-1" title="បំបែកបន្ទះដែលបានរើស">
        <span>🔨</span>
        <span>បំបែក</span>
      </button>

      <button id="btnDecomposeAndPush" class="px-2.5 py-1 bg-purple-600 active:scale-95 text-white rounded-lg text-xs font-black shadow-md transition hidden items-center gap-1" title="បំបែករួចរុញពង្រាយទៅជួរខាងស្តាំ">
        <span>💨</span>
        <span>បំបែក & រុញ</span>
      </button>

      <button id="btnDeselectAllHeader" class="px-2.5 py-1 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs font-black shadow-sm active:scale-95 transition hidden items-center gap-1 border border-slate-300" title="ដោះការជ្រើសរើសទាំងអស់">
        <span class="text-rose-600">✕</span>
        <span>ដោះរើស</span>
      </button>

      <button id="btnMultiSelect" class="px-2 py-1 bg-white border-2 border-slate-300 rounded-lg text-xs font-bold text-slate-700 shadow-sm active:scale-95 transition flex items-center gap-1" title="បើក/បិទ មុខងាររើសច្រើន">
        <span>☑</span>
        <span class="hidden md:inline">រើសច្រើន</span>
      </button>

      <button id="btnSelectAll" class="px-2 py-1 bg-white border-2 border-slate-300 rounded-lg text-xs font-bold text-slate-700 shadow-sm active:scale-95 transition" title="រើសដុំទាំងអស់លើក្ដារ">
        ទាំងអស់
      </button>

      <button id="btnDeleteSelected" class="px-2 py-1 bg-rose-50 border-2 border-rose-300 text-rose-700 rounded-lg text-xs font-bold shadow-sm active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed" disabled title="លុបដុំដែលបានរើស">
        🗑
      </button>

      <div class="w-0.5 h-6 bg-slate-300 mx-0.5 hidden sm:block"></div>

      <button id="btnOpenColorModal" class="px-2 py-1 bg-amber-50 border-2 border-amber-300 text-amber-900 rounded-lg text-xs font-black shadow-sm active:scale-95 transition flex items-center gap-1">
        <span>🎨</span>
        <span class="hidden md:inline">ពណ៌</span>
      </button>

      <button id="btnToggleLang" class="px-2 py-1 bg-white border-2 border-slate-300 rounded-lg text-xs font-bold text-slate-700 shadow-sm active:scale-95 transition flex items-center gap-1">
        <span>🔢</span>
        <span id="txtNumSystem">0</span>
      </button>

      <button id="btnResetCanvas" class="px-2 py-1 bg-rose-50 border-2 border-rose-300 text-rose-700 rounded-lg text-xs font-bold shadow-sm active:scale-95 transition">
        កំណត់ឡើងវិញ
      </button>
    </div>
  </header>

  <!-- MAIN CANVAS -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- LEFT SIDEBAR -->
    <aside class="w-13 sm:w-16 bg-gradient-to-b from-sky-200 via-blue-100 to-sky-200 border-r-3 border-sky-400 flex flex-col items-center py-2 gap-2 overflow-y-auto shrink-0 z-20 select-none shadow-md" style="scrollbar-width: none;">
      <div id="cartoonContainer" class="flex flex-col items-center gap-2 w-full"></div>
    </aside>

    <!-- CENTER INTERACTIVE GRID BOARD -->
    <div id="gridBoard" class="flex-1 relative math-grid overflow-hidden">
      <div id="selectionMarquee" class="selection-marquee hidden"></div>
      
      <!-- Transform Container -->
      <div id="zoomContainer" class="absolute inset-0 origin-top-left transition-transform duration-75">
        <div id="layerBlocks" class="absolute inset-0 pointer-events-auto z-10"></div>
        <div id="layerCards" class="absolute inset-0 pointer-events-auto z-25"></div>
        <div id="layerDrawings" class="absolute inset-0 pointer-events-auto z-30"></div>
        <canvas id="activeDrawCanvas" class="absolute inset-0 pointer-events-none z-35"></canvas>
      </div>

      <!-- Floating Selection Bar -->
      <div id="floatingSelectBar" class="absolute top-4 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 text-white backdrop-blur-md px-4 py-2 rounded-2xl shadow-2xl border border-slate-600 flex items-center gap-3 hidden">
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-400 animate-ping"></span>
          <span id="selectedCountText" class="text-xs font-bold text-slate-200">បានរើស 1</span>
        </div>
        <div class="h-4 w-px bg-slate-600"></div>
        <button id="btnDeselectFloating" class="px-2.5 py-1 bg-white/20 hover:bg-rose-500/80 active:scale-95 text-white text-xs font-black rounded-lg transition flex items-center gap-1 cursor-pointer">
          <span>✕</span>
          <span>ដោះការរើស</span>
        </button>
      </div>

      <!-- Abacus Mode Layer -->
      <div id="layerAbacus" class="absolute inset-0 z-20 hidden flex items-center justify-center pointer-events-none">
        <div class="w-full max-w-2xl h-72 sm:h-80 flex justify-around items-end px-4 sm:px-8 pb-6 sm:pb-8 border-b-8 border-slate-800 bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl pointer-events-auto mx-2">
          <div class="flex flex-col items-center h-full justify-between">
            <span id="abacusHeaderTt" class="font-black text-base sm:text-xl">ម៉ឺន</span>
            <div id="abacusTt" class="relative w-4 h-52 sm:h-60 bg-slate-400 rounded-full flex flex-col-reverse items-center py-1 gap-1.5 shadow-inner"></div>
          </div>
          <div class="flex flex-col items-center h-full justify-between">
            <span id="abacusHeaderTh" class="font-black text-base sm:text-xl">ពាន់</span>
            <div id="abacusTh" class="relative w-4 h-52 sm:h-60 bg-slate-400 rounded-full flex flex-col-reverse items-center py-1 gap-1.5 shadow-inner"></div>
          </div>
          <div class="flex flex-col items-center h-full justify-between">
            <span id="abacusHeaderH" class="font-black text-base sm:text-xl">រយ</span>
            <div id="abacusH" class="relative w-4 h-52 sm:h-60 bg-slate-400 rounded-full flex flex-col-reverse items-center py-1 gap-1.5 shadow-inner"></div>
          </div>
          <div class="flex flex-col items-center h-full justify-between">
            <span id="abacusHeaderT" class="font-black text-base sm:text-xl">ដប់</span>
            <div id="abacusT" class="relative w-4 h-52 sm:h-60 bg-slate-400 rounded-full flex flex-col-reverse items-center py-1 gap-1.5 shadow-inner"></div>
          </div>
          <div class="flex flex-col items-center h-full justify-between">
            <span id="abacusHeaderO" class="font-black text-base sm:text-xl">រាយ</span>
            <div id="abacusO" class="relative w-4 h-52 sm:h-60 bg-slate-400 rounded-full flex flex-col-reverse items-center py-1 gap-1.5 shadow-inner"></div>
          </div>
        </div>
      </div>

      <!-- PEN OPTIONS POPUP -->
      <div id="penOptionsBar" class="absolute z-50 pointer-events-auto hidden shadow-2xl bg-[#2d2c3a] border border-slate-700/90 rounded-2xl p-2.5 flex flex-col gap-2 select-none bottom-3 left-4">
        <div class="flex items-end gap-2.5">
          <button data-brush="pencil" type="button" class="pen-opt-btn flex flex-col items-center gap-1 p-1 rounded-xl border border-transparent hover:bg-white/10 transition active:scale-95 cursor-pointer" title="ខ្មៅដៃ">
            <svg class="w-7 h-12" viewBox="0 0 32 60" fill="none">
              <polygon points="16,4 4,24 28,24" id="pencilTipColor" fill="#84cc16"/>
              <polygon points="4,24 28,24 28,28 4,28" fill="#fef08a"/>
              <rect x="4" y="28" width="24" height="28" id="pencilBodyColor" fill="#65a30d" rx="2"/>
              <path d="M12,28 L12,56 M20,28 L20,56" stroke="#4d7c0f" stroke-width="1.5"/>
            </svg>
            <span class="text-[9px] font-bold text-slate-300">ខ្មៅដៃ</span>
          </button>

          <button data-brush="pen" type="button" class="pen-opt-btn active flex flex-col items-center gap-1 p-1 rounded-xl border border-transparent hover:bg-white/10 transition active:scale-95 cursor-pointer" title="ប៊ិចទឹក">
            <svg class="w-7 h-12" viewBox="0 0 32 60" fill="none">
              <path d="M16,6 C16,6 8,18 8,24 L24,24 C24,18 16,6 16,6 Z" id="penTipColor" fill="#a855f7"/>
              <rect x="7" y="24" width="18" height="6" fill="#94a3b8"/>
              <rect x="5" y="30" width="22" height="26" fill="#475569" rx="2"/>
            </svg>
            <span class="text-[9px] font-bold text-slate-300">ប៊ិចទឹក</span>
          </button>

          <button data-brush="highlighter" type="button" class="pen-opt-btn flex flex-col items-center gap-1 p-1 rounded-xl border border-transparent hover:bg-white/10 transition active:scale-95 cursor-pointer" title="ហាយឡាយ">
            <svg class="w-7 h-12" viewBox="0 0 32 60" fill="none">
              <polygon points="8,12 24,6 24,24 8,24" id="highlighterTipColor" fill="#facc15"/>
              <rect x="7" y="24" width="18" height="6" fill="#cbd5e1"/>
              <path d="M6,30 C6,30 10,34 10,40 L10,56 L22,56 L22,40 C22,34 26,30 26,30 Z" fill="#64748b"/>
            </svg>
            <span class="text-[9px] font-bold text-slate-300">ហាយឡាយ</span>
          </button>

          <button data-brush="eraser" type="button" class="pen-opt-btn flex flex-col items-center gap-1 p-1 rounded-xl border-2 border-transparent bg-slate-800/80 hover:bg-white/10 transition active:scale-95 cursor-pointer" title="ជ័រលុប">
            <div class="w-7 h-12 flex flex-col items-center justify-between rounded-t-full bg-slate-300 border border-slate-400 overflow-hidden shadow-inner">
              <div class="w-full h-6 bg-slate-200"></div>
              <div class="w-full h-6 bg-slate-400"></div>
            </div>
            <span class="text-[9px] font-black text-slate-200">ជ័រលុប</span>
          </button>

          <div class="h-10 w-px bg-slate-700/80 mx-0.5"></div>
          
          <div class="flex flex-col gap-1 items-center justify-center pb-1">
            <div class="flex gap-1.5">
              <button data-pencolor="#1e293b" class="btn-quick-color w-4 h-4 rounded-full border border-white/50 active:scale-75 transition" style="background:#1e293b;"></button>
              <button data-pencolor="#ef4444" class="btn-quick-color w-4 h-4 rounded-full border border-white/50 active:scale-75 transition" style="background:#ef4444;"></button>
              <button data-pencolor="#2563eb" class="btn-quick-color w-4 h-4 rounded-full border border-white/50 active:scale-75 transition" style="background:#2563eb;"></button>
            </div>
            <div class="flex gap-1.5">
              <button data-pencolor="#16a34a" class="btn-quick-color w-4 h-4 rounded-full border border-white/50 active:scale-75 transition" style="background:#16a34a;"></button>
              <button data-pencolor="#facc15" class="btn-quick-color w-4 h-4 rounded-full border border-white/50 active:scale-75 transition" style="background:#facc15;"></button>
              <button data-pencolor="#a855f7" class="btn-quick-color w-4 h-4 rounded-full border border-white/50 active:scale-75 transition" style="background:#a855f7;"></button>
            </div>
          </div>
        </div>

        <div class="pt-1.5 border-t border-slate-700/70 flex items-center justify-between gap-2 px-1">
          <span class="text-[10px] font-bold text-slate-300">ទំហំ៖</span>
          <input type="range" id="brushSizeSlider" min="1" max="40" value="4" class="pen-size-slider flex-1 cursor-pointer">
          <div class="flex items-center justify-center w-6 h-6 rounded-md bg-slate-800 border border-slate-600">
            <div id="brushSizePreview" class="rounded-full bg-sky-400 transition-all duration-75" style="width: 5px; height: 5px;"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- BOTTOM CONTROL TOOLBAR -->
  <div class="relative w-full shrink-0 z-30 flex justify-center">
    <button id="btnToggleBottomBar" class="absolute -top-7 px-3 py-0.5 bg-slate-200 hover:bg-white text-slate-700 border-2 border-b-0 border-slate-300 rounded-t-xl font-bold text-xs shadow-md active:scale-95 transition flex items-center gap-1 cursor-pointer">
      <span id="iconToggleBottom">⌄</span>
      <span id="txtToggleBottom" class="hidden sm:inline">លាក់របារ</span>
    </button>

    <footer id="bottomFooter" class="w-full bg-slate-100 border-t-3 border-slate-300 py-2 px-3 flex justify-between items-center shadow-lg overflow-x-auto" style="scrollbar-width: none;">
      
      <div class="flex items-center gap-2 shrink-0 select-none pr-3">
        <!-- Capsule 1: Pointer, Pen, Color, Clear -->
        <div class="bg-[#2d2c3a] border border-slate-700/90 rounded-full px-2.5 py-1.5 flex items-center gap-2 shadow-md">
          <button id="btnToolPointer" type="button" class="w-8 h-8 rounded-full bg-white/25 text-white flex items-center justify-center transition active:scale-90 cursor-pointer shadow-sm" title="សញ្ញាព្រួញ (Pointer)">
            <svg class="w-4 h-4 pointer-events-none drop-shadow" viewBox="0 0 24 24" fill="none">
              <path d="M4 3L11.5 21L14.5 13.5L22 10.5L4 3Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </button>

          <button id="btnToolPen" type="button" class="w-8 h-8 rounded-full hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition active:scale-90 cursor-pointer relative" title="ប៊ិចគូរ (Pen)">
            <svg class="w-4 h-4 pointer-events-none fill-current" viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
          </button>

          <div class="relative flex items-center justify-center">
            <button id="btnPenColorDot" type="button" class="w-5 h-5 rounded-full border-2 border-white/60 shadow-md transition active:scale-90 cursor-pointer" style="background-color: #a855f7;" title="រើសពណ៌ប៊ិច"></button>
            <input type="color" id="nativePenColorInput" value="#a855f7" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
          </div>

          <button id="btnToolClearDraw" type="button" class="w-6 h-6 rounded-full hover:bg-rose-500/30 text-slate-400 hover:text-rose-400 flex items-center justify-center transition active:scale-90 cursor-pointer" title="លុបបន្ទាត់គូរ">
            <svg class="w-3.5 h-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
